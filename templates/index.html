<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Sudoku</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 15px 0;
            color: #1a252f;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        select, button {
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid #dcdfe6;
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #f5f7fa;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .timer {
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            background: #e2e8f0;
            padding: 7px 14px;
            border-radius: 6px;
            color: #1e293b;
        }

        /* Board Container Outer Border */
        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 45px);
            grid-template-rows: repeat(9, 45px);
            border: 3px solid #1e293b;
            border-radius: 4px;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Border around EVERY individual number box */
        .cell {
            width: 45px;
            height: 45px;
            text-align: center;
            font-size: 20px;
            background-color: #ffffff;
            outline: none;
            color: #2563eb;
            font-weight: bold;
            box-sizing: border-box;
            border: 1px solid #94a3b8; /* Light black / dark gray line for each cell */
        }

        .cell.fixed {
            background-color: #f1f5f9;
            color: #0f172a;
            font-weight: 700;
            pointer-events: none;
        }

        /* Color Feedback */
        .cell.correct {
            background-color: #dcfce7 !important;
            color: #15803d !important;
        }

        .cell.incorrect {
            background-color: #fee2e2 !important;
            color: #b91c1c !important;
        }

        /* Thicker borders for 3x3 block separation */
        .cell:nth-child(3n) {
            border-right: 3px solid #1e293b;
        }
        .cell:nth-child(9n) {
            border-right: 1px solid #94a3b8; /* Revert last column back to standard cell border */
        }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 3px solid #1e293b;
        }

        .paused {
            filter: blur(6px);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sudoku</h1>

    <div class="controls">
        <select id="difficulty" onchange="startNewGame()">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>

        <button class="btn-primary" onclick="startNewGame()">New Game</button>
        <button id="pause-btn" onclick="togglePause()">Pause</button>
        <div class="timer" id="timer">00:00</div>
    </div>

    <div class="sudoku-board" id="board"></div>
</div>

<script>
    let currentSolution = [];
    let timerInterval = null;
    let secondsElapsed = 0;
    let isPaused = false;

    function startTimer() {
        clearInterval(timerInterval);
        secondsElapsed = 0;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            if (!isPaused) {
                secondsElapsed++;
                updateTimerDisplay();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
    }

    function togglePause() {
        isPaused = !isPaused;
        const board = document.getElementById('board');
        const btn = document.getElementById('pause-btn');

        if (isPaused) {
            board.classList.add('paused');
            btn.innerText = 'Resume';
        } else {
            board.classList.remove('paused');
            btn.innerText = 'Pause';
        }
    }

    async function startNewGame() {
        isPaused = false;
        document.getElementById('board').classList.remove('paused');
        document.getElementById('pause-btn').innerText = 'Pause';
        
        const difficulty = document.getElementById('difficulty').value;
        const response = await fetch(`/api/new-game?difficulty=${difficulty}`);
        const data = await response.json();
        
        currentSolution = data.solution;
        drawBoard(data.puzzle);
        startTimer();
    }

    function drawBoard(puzzle) {
        const board = document.getElementById('board');
        board.innerHTML = '';

        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const val = puzzle[r][c];
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'cell';

                if (val !== 0) {
                    input.value = val;
                    input.classList.add('fixed');
                } else {
                    input.addEventListener('input', (e) => handleInput(e, r, c));
                }
                board.appendChild(input);
            }
        }
    }

    function handleInput(e, r, c) {
        const inputField = e.target;
        const num = parseInt(inputField.value);

        inputField.classList.remove('correct', 'incorrect');

        if (isNaN(num) || num < 1 || num > 9) {
            inputField.value = '';
            return;
        }

        if (num === currentSolution[r][c]) {
            inputField.classList.add('correct');
        } else {
            inputField.classList.add('incorrect');
        }
    }

    startNewGame();
</script>

</body>
</html>
